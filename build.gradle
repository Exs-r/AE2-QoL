plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.78'
}

group = 'com.ae2qol'
version = '1.0.0'

base {
    archivesName = 'ae2qol'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
}

neoForge {
    version = '21.1.219'

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        ae2qol {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // AE2 and its own dependencies are provided at runtime by the actual mod jars.
    // They are only needed to compile against the AE2 API, so they are compileOnly.
    compileOnly files('libs/appliedenergistics2-19.2.17.jar')
    compileOnly files('libs/guideme-21.1.15.jar')
    compileOnly files('libs/Glodium-1.21-2.2-neoforge.jar')
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : 'ae2qol',
                'Specification-Vendor'    : 'ae2qol',
                'Specification-Version'   : '1',
                'Implementation-Title'    : 'AE2 QoL',
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : 'ae2qol'
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
